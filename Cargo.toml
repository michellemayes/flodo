[package]
name = "flodo"
version = "0.1.2"
edition = "2021"
description = "A floating, minimal to-do list"
license = "MIT"

[dependencies]
eframe = { version = "0.35", default-features = false, features = [
    "glow",
    "x11",
    "wayland",
    "default_fonts",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false }
fontdb = { version = "0.23", default-features = false, features = ["fs", "memmap"] }
skrifa = "0.42.1"
global-hotkey = "0.8"

[features]
# Enables eframe's built-in headless screenshot hook (EFRAME_SCREENSHOT_TO).
screenshot = ["eframe/__screenshot"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
