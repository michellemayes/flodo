name: Release

# Every merge to main ships, with nothing to tag or bump by hand.
#
#   1. CI passes on a push to main.
#   2. `plan` waits out the debounce window (RELEASE_DEBOUNCE_MINUTES, default
#      10). A later green push to main cancels the waiting run and starts its
#      own wait, so a burst of merges becomes one release of the last one.
#   3. The next version bumps the latest release tag. Patch by default; minor
#      or major when anything merged since asks for it:
#        - a `release:minor` or `release:major` label on the merged PR, or
#        - `[minor]` or `[major]` anywhere in a commit message.
#      Cargo.toml's version still wins if it is higher.
#   4. Build, sign (and notarize, when the Apple secrets exist), tag, and
#      publish, with a `latest.json` the app's update check reads.
#
# Run it from the Actions tab to release current main immediately, without
# waiting, and optionally choose the bump there. Merges whose head commit says
# `[skip ci]` skip CI and therefore the release too.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto reads PR labels and commit messages)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Debounce and pick version
    # A CI run for a PR whose branch happens to be called main is not a merge.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # Only the waiting is cancellable. Once a run is past this job its builds
    # and publish carry on; a newer run just finds main moved and releases that.
    concurrency:
      group: release-debounce
      cancel-in-progress: true
    outputs:
      release: ${{ steps.version.outputs.release }}
      sha: ${{ steps.version.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Debounce
        if: github.event_name == 'workflow_run'
        env:
          MINUTES: ${{ vars.RELEASE_DEBOUNCE_MINUTES || '10' }}
        run: |
          echo "Waiting $MINUTES min for more merges; a newer one cancels this run."
          sleep "$(( MINUTES * 60 ))"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pick version
        id: version
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          BUMP: ${{ inputs.bump || 'auto' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse HEAD)"
          # Release what CI actually tested. If main has moved on, that newer
          # commit's own CI run will trigger (or cancel into) a release of it.
          if [ -n "$RUN_SHA" ] && [ "$RUN_SHA" != "$SHA" ]; then
            echo "main is at $SHA, past $RUN_SHA — leaving it to that commit's run."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST="$(git tag --list --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$LAST" ] && [ -z "$(git rev-list "$LAST..$SHA")" ]; then
            echo "Nothing merged since $LAST."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Highest bump anything since the last release asked for.
          LEVEL="$BUMP"
          if [ "$LEVEL" = "auto" ]; then
            RANGE="${LAST:+$LAST..}$SHA"
            ASKED="$(git log --format=%B "$RANGE" | grep -oiE '\[(minor|major)\]' | tr -d '[]' || true)"
            # Merge commits say "Merge pull request #12"; squash merges end "(#12)".
            PRS="$(git log --format=%s "$RANGE" |
              sed -nE 's/^Merge pull request #([0-9]+).*/\1/p; s/.*\(#([0-9]+)\)$/\1/p' | sort -u)"
            for PR in $PRS; do
              ASKED="$ASKED $(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels \
                -q '.labels[].name | select(startswith("release:")) | ltrimstr("release:")' || true)"
            done
            ASKED="$(tr '[:upper:]' '[:lower:]' <<< "$ASKED" | tr -s ' \n' '\n')"
            if grep -qx major <<< "$ASKED"; then LEVEL=major
            elif grep -qx minor <<< "$ASKED"; then LEVEL=minor
            else LEVEL=patch
            fi
          fi

          CARGO="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$LAST" ]; then
            NEXT="$CARGO"
          else
            IFS=. read -r MAJ MIN PAT <<< "${LAST#v}"
            case "$LEVEL" in
              major) BUMPED="$((MAJ + 1)).0.0" ;;
              minor) BUMPED="$MAJ.$((MIN + 1)).0" ;;
              *)     BUMPED="$MAJ.$MIN.$((PAT + 1))" ;;
            esac
            NEXT="$(printf '%s\n%s\n' "$BUMPED" "$CARGO" | sort -V | tail -n 1)"
          fi

          echo "Releasing $SHA as v$NEXT ($LEVEL bump; previous: ${LAST:-none}, Cargo.toml: $CARGO)"
          {
            echo "release=true"
            echo "sha=$SHA"
            echo "tag=v$NEXT"
            echo "version=$NEXT"
          } >> "$GITHUB_OUTPUT"

  macos:
    name: macOS universal .app
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      # Set by scripts/setup-notarization.sh. Without them the build falls back
      # to an ad-hoc signature, exactly as before.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # `flodo --version` and the embedded Info.plist both come from
      # CARGO_PKG_VERSION, so the released number goes into Cargo.toml here
      # rather than in a commit back to main.
      - name: Stamp version
        run: perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml

      - name: Import Developer ID certificate
        id: cert
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_CERT_P12 holds no 'Developer ID Application' identity. Re-run scripts/setup-notarization.sh."
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build Flodo.app
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: ./scripts/bundle-macos.sh --universal --version "$VERSION" ${IDENTITY:+--sign "$IDENTITY"}

      - name: Notarize
        if: steps.cert.outputs.identity != '' && env.APPLE_API_KEY != ''
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY" | base64 --decode > "$KEY"
          ditto -c -k --keepParent dist/Flodo.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          STATUS="$(jq -r '.status // empty' "$RUNNER_TEMP/notary.json")"
          if [ "$STATUS" != "Accepted" ]; then
            ID="$(jq -r '.id // empty' "$RUNNER_TEMP/notary.json")"
            [ -n "$ID" ] && xcrun notarytool log "$ID" \
              --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" || true
            echo "::error::Notarization ${STATUS:-failed}."
            exit 1
          fi
          xcrun stapler staple dist/Flodo.app
          xcrun stapler validate dist/Flodo.app
          spctl --assess --type execute --verbose dist/Flodo.app
          rm "$KEY"

      - name: Package
        run: |
          cd dist
          ditto -c -k --keepParent Flodo.app "flodo-$TAG-macos-universal.zip"
          rm -rf Flodo.app flodo

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  unix:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Stamp version
        shell: bash
        run: perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgl1-mesa-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          BASE="flodo-$TAG-$NAME"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/$TARGET/release/flodo.exe" dist/
            (cd dist && 7z a "$BASE.zip" flodo.exe && rm flodo.exe)
          else
            cp "target/$TARGET/release/flodo" dist/
            (cd dist && tar czf "$BASE.tar.gz" flodo && rm flodo)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    name: Publish release
    needs: [plan, macos, unix]
    runs-on: ubuntu-latest
    # Two runs that both got past the debounce publish one after the other,
    # never interleaved.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      NOTARIZED: ${{ secrets.MACOS_CERT_P12 != '' && secrets.APPLE_API_KEY != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # What a running Flodo fetches, via releases/latest/download/latest.json,
      # to learn there is something newer and where its archive is. The keys
      # are the archive names minus `flodo-<tag>-` and the extension, and must
      # match PLATFORM in src/update.rs.
      - name: Update manifest
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cd artifacts
          jq -Rn \
            --arg version "$VERSION" \
            --arg page "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --arg base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --arg prefix "flodo-$TAG-" '
            [inputs
             | capture("^(?<sha>[0-9a-f]{64}) [ *](?<file>.+)$")
             | select(.file | startswith($prefix))
             | {key: (.file | ltrimstr($prefix) | sub("\\.(zip|tar\\.gz)$"; "")),
                value: {url: "\($base)/\(.file)", sha256: .sha}}]
            | {version: $version, url: $page, assets: from_entries}' \
            < SHA256SUMS.txt > latest.json
          cat latest.json
          for key in macos-universal linux-x86_64 windows-x86_64; do
            jq -e --arg k "$key" '.assets[$k]' latest.json >/dev/null \
              || { echo "::error::latest.json has no $key archive"; exit 1; }
          done

      - name: macOS install note
        id: note
        run: |
          {
            echo 'text<<EOF'
            if [ "$NOTARIZED" = "true" ]; then
              echo '**macOS** — download the universal `.zip`, unzip, drag `Flodo.app` to Applications.'
              echo 'Signed with a Developer ID and notarized by Apple, so it opens normally.'
            else
              echo '**macOS** — download the universal `.zip`, unzip, drag `Flodo.app` to Applications.'
              echo 'The build is ad-hoc signed but not notarized, so the first launch needs'
              echo 'right-click → **Open**, or `xattr -dr com.apple.quarantine /Applications/Flodo.app`.'
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # Creates the tag on the released commit, so nothing is pushed to main.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ needs.plan.outputs.sha }}
          name: Flodo ${{ needs.plan.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## Install

            ${{ steps.note.outputs.text }}

            **Linux / Windows** — download the archive and run the `flodo` binary.

            Verify a download against `SHA256SUMS.txt`.
