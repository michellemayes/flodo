name: Release

# Tag pattern: push a semver tag to cut a release. The leading `v` is optional,
# so both `v0.1.0` and `0.1.0` work.
#   git tag -a v0.1.0 -m "Flodo v0.1.0" && git push origin v0.1.0
# Pre-releases (v0.1.0-beta.1, 1.0.0-rc.2) are published as GitHub pre-releases.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS universal .app
    runs-on: macos-latest
    outputs:
      # Read by the release job, which has to describe the download honestly:
      # a notarized build opens on a double-click, an ad-hoc one does not.
      notarized: ${{ steps.notarize.outputs.notarized }}
    env:
      # On the job rather than the step so the steps can ask whether signing is
      # configured at all. It is not, on a fork or before the secrets exist,
      # and a release still has to come out — just an unnotarized one.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      # Build the tag that was asked for, not whatever the default branch is.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Into a throwaway keychain that goes away with the runner. The password
      # is generated here rather than carried as a secret — nothing outside
      # this step ever needs it.
      - name: Import the Developer ID certificate
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          # `create-keychain` does not add it to the search list, and the
          # search list — not the default — is where codesign looks for a key.
          # Nothing else in this job wants the runner's login keychain.
          security list-keychains -d user -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign stops to ask for permission to use the key,
          # and a runner has nobody to ask.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      # The same script contributors run locally: universal binary, rendered
      # icon, Info.plist from macos/Info.plist. It picks the Developer ID up
      # from the environment and falls back to an ad-hoc signature.
      - name: Build Flodo.app
        run: ./scripts/bundle-macos.sh --universal --version "${{ steps.v.outputs.version }}"

      # Before packaging, not after: the ticket is stapled into the bundle, so
      # an archive made first would carry an unstapled copy.
      - name: Notarize and staple
        id: notarize
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          ./scripts/notarize-macos.sh dist/Flodo.app
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          cd dist
          ditto -c -k --keepParent Flodo.app "flodo-${{ steps.v.outputs.tag }}-macos-universal.zip"
          rm -rf Flodo.app flodo

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgl1-mesa-dev

      - name: Resolve version
        id: v
        shell: bash
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          BASE="flodo-${{ steps.v.outputs.tag }}-${{ matrix.name }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/flodo.exe" dist/
            (cd dist && 7z a "$BASE.zip" flodo.exe && rm flodo.exe)
          else
            cp "target/${{ matrix.target }}/release/flodo" dist/
            (cd dist && tar czf "$BASE.tar.gz" flodo && rm flodo)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    name: Publish release
    needs: [macos, unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Resolve tag
        id: v
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # Two versions of the macOS paragraph, because telling people to
      # right-click a build that no longer needs it is its own small annoyance.
      - name: Compose the install notes
        run: |
          if [ "${{ needs.macos.outputs.notarized }}" = "true" ]; then
          cat > NOTES.md <<'MD'
          ## Install

          **macOS** — download the universal `.zip`, unzip, drag `Flodo.app` to Applications.
          Signed with a Developer ID and notarized by Apple, so it opens on a double-click.

          **Linux / Windows** — download the archive and run the `flodo` binary.

          Verify a download against `SHA256SUMS.txt`.
          MD
          else
          cat > NOTES.md <<'MD'
          ## Install

          **macOS** — download the universal `.zip`, unzip, drag `Flodo.app` to Applications.
          This build is ad-hoc signed but not notarized, so the first launch needs
          right-click → **Open**, or:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Flodo.app
          ```

          **Linux / Windows** — download the archive and run the `flodo` binary.

          Verify a download against `SHA256SUMS.txt`.
          MD
          fi
          cat NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Flodo ${{ steps.v.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.v.outputs.tag, '-') }}
          generate_release_notes: true
          files: artifacts/*
          body_path: NOTES.md
